name: Map website portability
on:
  push:
    paths:
      - 'Build-Deploy-Website.sh'
      - 'tools/aion2-map-viewer/**'
      - '.github/workflows/map-website.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'Build-Deploy-Website.sh'
      - 'tools/aion2-map-viewer/**'
      - '.github/workflows/map-website.yml'
      - '.gitattributes'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: bash -n Build-Deploy-Website.sh
      - run: npm --prefix tools/aion2-map-viewer test
